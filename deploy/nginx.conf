# nginx site for ayhabd.com. Save as /etc/nginx/sites-available/ayha, link it into sites-enabled,
# then run: sudo certbot --nginx -d ayhabd.com -d www.ayhabd.com
# Replace /srv/ayha with the folder that contains manage.py.

server {
    listen 80;
    server_name ayhabd.com www.ayhabd.com;
    return 301 https://ayhabd.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ayhabd.com www.ayhabd.com;

    # certbot fills these two lines in for you
    ssl_certificate     /etc/letsencrypt/live/ayhabd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayhabd.com/privkey.pem;

    client_max_body_size 12m;          # product photo uploads in the admin

    location /static/ {
        alias /srv/ayha/staticfiles/;  # created by: python manage.py collectstatic
        expires 30d;
        add_header Cache-Control "public";
    }
    location /media/ {
        alias /srv/ayha/media/;        # uploaded product photos
        expires 7d;
    }

    location / {
        proxy_pass http://unix:/run/ayha/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IMPORTANT: this exact line makes nginx add the visitor's real address LAST.
        # The shop's order limits rely on that. If you use Cloudflare, ask for help first.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
